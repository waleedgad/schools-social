appId: app.schoolsocialhub.library
productName: School Social Hub Library
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  - from: models
    to: models
  - from: helpers
    to: helpers
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/onnxruntime-node/**
# Each system only carries its own image and face engines. (These were
# left out for every system, so a Windows build had no image engine at all.)
win:
  target: nsis
  files:
    - "!node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**"
    - "!node_modules/@img/*-{linux,linuxmusl,darwin}-*/**"
linux:
  target: dir
  files:
    - "!node_modules/onnxruntime-node/bin/napi-v6/{darwin,win32}/**"
    - "!node_modules/@img/*-{darwin,win32}-*/**"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.photography
  # Ready for Apple signing (quality plan, Phase 5). Without a Developer ID
  # certificate and Apple sign-in on the build machine, the app is built
  # unsigned exactly as before; with them (see docs/signing.md) it is signed
  # with the hardened runtime and sent to Apple for notarisation.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  files:
    - "!node_modules/onnxruntime-node/bin/napi-v6/{win32,linux}/**"
    - "!node_modules/@img/*-{linux,linuxmusl,win32}-*/**"
publish:
  provider: github
  owner: waleedgad
  repo: schools-social
