appId: app.schoolsocialhub.library
productName: School Social Hub Library
directories:
  output: release
files:
  - dist/**
  - package.json
  - "!node_modules/onnxruntime-node/bin/napi-v6/{win32,linux}/**"
  - "!node_modules/@img/*-{linux,linuxmusl,win32}-*/**"
extraResources:
  - from: models
    to: models
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
  - node_modules/onnxruntime-node/**
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.photography
publish:
  provider: github
  owner: waleedgad
  repo: schools-social
