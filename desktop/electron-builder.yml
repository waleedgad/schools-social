appId: app.schoolsocialhub.library
productName: School Social Hub Library
directories:
  output: release
files:
  - dist/**
  - package.json
asarUnpack:
  - node_modules/sharp/**
  - node_modules/@img/**
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.photography
publish:
  provider: github
  owner: waleedgad
  repo: schools-social
