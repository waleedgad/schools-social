# Security review (17 Nov 2026): GitHub's free code scanner reads the website
# and the Mac/Windows app's code for security mistakes (unsafe links,
# injection, leaked secrets in code paths...). Results: Security > Code
# scanning on GitHub. Free for public repositories.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - "**/node_modules/**"
              - desktop/models/**
              - desktop/bench/**
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
