# Runs the automatic checks on every change, before anything reaches Waleed.
# Website: type check, lint, a full build and the robot tests against a
# private test database. Mac app: its tests and robot
# tests on a real Mac (and on Linux, which is quicker). Windows joins once the app ships there.
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Stops on any serious known security hole in the libraries the website ships with.
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit
      - run: npm run lint
      # Website and Mac app share one set of colours (design/tokens.json).
      - run: node scripts/design-tokens.mjs
      - run: node scripts/check-forms.mjs
      - run: node scripts/announce-sync.mjs
      # A private, empty copy of the database with every migration applied,
      # so the robot tests can sign up, create a school and use it.
      - run: npx -y supabase@2.122.1 start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta
      - run: grep -v '^#' e2e/test-db.env >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The Mac app sending to and deleting from the same test database.
      - name: Mac app and website together
        working-directory: desktop
        # The built website runs too, for the teacher's "Is this …?" check (B-03).
        run: |
          (cd .. && npx next start -p 3123 > next.log 2>&1 &)
          # The Electron download sometimes times out (504): try three times, and stop if it never works.
          for i in 1 2 3; do npm ci && break; [ $i = 3 ] && exit 1; sleep 20; done
          npm run build
          for i in $(seq 60); do curl -sf -o /dev/null http://localhost:3123/en/login && break; sleep 1; done
          WEB_URL=http://localhost:3123 xvfb-run -a npx playwright test e2e/web-sync.spec.ts e2e/nothing-hangs.spec.ts e2e/teacher-check.spec.ts e2e/error-reports.spec.ts e2e/book-review.spec.ts e2e/post-pictures.spec.ts e2e/make-week.spec.ts
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-test-report
          path: |
            e2e-report
            desktop/e2e-report

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # The Electron download sometimes times out (504): try three times.
      - shell: bash
        run: for i in 1 2 3; do npm ci && break; [ $i = 3 ] && exit 1; sleep 20; done
      # Stops on any serious known security hole in the libraries the app ships with.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      # Robot tests: start the real app and click through every tab.
      - if: runner.os == 'Linux'
        run: npm run build && xvfb-run -a npx playwright test
      - if: runner.os != 'Linux'
        run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-report-${{ matrix.os }}
          path: desktop/e2e-report
          if-no-files-found: ignore

  # Build check: make the real app a school installs (Apple Silicon Mac and
  # Windows, not signed yet) and start it once: it must read photos with its
  # image engine and load its face engine.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: --mac zip --arm64
            exe: release/mac-arm64/School Social Hub Library.app/Contents/MacOS/School Social Hub Library
          - os: windows-latest
            build: --win nsis dir
            exe: release/win-unpacked/School Social Hub Library.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # The Electron download sometimes times out (504): try three times.
      - shell: bash
        run: for i in 1 2 3; do npm ci && break; [ $i = 3 ] && exit 1; sleep 20; done
      - run: npm run build && npx electron-builder ${{ matrix.build }} --publish never
      - run: PACKAGED_APP="$PWD/${{ matrix.exe }}" npx playwright test e2e/packaged.spec.ts
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: mac-app-apple-silicon
          path: desktop/release/*.zip
          retention-days: 14
      # A Windows test build (installer), kept 14 days.
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/release/*.exe
          retention-days: 14

  # Update check: install this version on Windows, then let it update itself
  # to a pretend next version from a local update server. It must make a
  # safety copy first and keep the library, names and settings.
  update:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # The Electron download sometimes times out (504): try three times.
      - shell: bash
        run: for i in 1 2 3; do npm ci && break; [ $i = 3 ] && exit 1; sleep 20; done
      - run: node scripts/update-test.mjs
