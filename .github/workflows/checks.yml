# Runs the automatic checks on every change, before anything reaches Waleed.
# Website: type check, lint, a full build and the robot tests against a
# private test database. Mac app: its tests and robot
# tests on a real Mac (and on Linux, which is quicker). Windows joins once the app ships there.
name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # A private, empty copy of the database with every migration applied,
      # so the robot tests can sign up, create a school and use it.
      - run: npx -y supabase@2.122.1 start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,realtime,postgres-meta,mailpit
      - run: grep -v '^#' e2e/test-db.env >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-test-report
          path: e2e-report

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      # Robot tests: start the real app and click through every tab.
      - if: runner.os == 'Linux'
        run: npm run build && xvfb-run -a npx playwright test
      - if: runner.os != 'Linux'
        run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-report-${{ matrix.os }}
          path: desktop/e2e-report
          if-no-files-found: ignore
