# Makes the Mac app a school installs, by hand from the Actions tab
# ("Run workflow"). Until the Apple Developer membership (quality plan,
# Phase 5) it is unsigned, as today. Once the five secrets in
# desktop/docs/signing.md are added, the same button makes a signed and
# notarised app that opens with no Terminal step.
name: Mac release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Build (signed and notarised when the secrets are there)
        run: |
          if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; echo "No certificate yet: building unsigned"; fi
          npm run build && npx electron-builder --mac zip dmg --arm64 --publish never
      - name: Check the signature and Apple's approval
        if: env.CSC_LINK != ''
        run: |
          APP="release/mac-arm64/School Social Hub Library.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose "$APP"
          xcrun stapler validate "$APP"
      - name: The built app starts, reads photos and finds faces
        run: PACKAGED_APP="$PWD/release/mac-arm64/School Social Hub Library.app/Contents/MacOS/School Social Hub Library" npx playwright test e2e/packaged.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            desktop/release/*.zip
            desktop/release/*.dmg
          retention-days: 30
