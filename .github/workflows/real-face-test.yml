# Checks the face test for the school's own photos (desktop/bench/real-faces)
# on the stand-in photos (free-licence photos of well-known adults from
# Wikimedia Commons, see face-bench.yml), laid out like a school's test
# folder. The real test runs on Waleed's computer; nothing real comes here.
name: Real-photo face test (dry run)

on:
  workflow_dispatch:
  push:
    paths:
      - desktop/bench/real-faces/**
      - .github/workflows/real-face-test.yml

concurrency:
  group: real-face-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build
      # the same stored photos and AuraFace as face-bench.yml
      - uses: actions/cache@v4
        with:
          path: ~/face-bench-photos
          key: face-bench-photos-v1-${{ hashFiles('desktop/bench/faces/people.json', 'desktop/bench/faces/fetch.mjs') }}
      - uses: actions/cache@v4
        with:
          path: ~/face-models
          key: auraface-v1
      - uses: actions/cache/restore@v4
        with:
          path: ~/real-face-cache
          key: real-face-cache-${{ github.run_id }}
          restore-keys: real-face-cache-
      - name: Download the stand-in photos
        run: node bench/faces/fetch.mjs ~/face-bench-photos 50
      - name: Download AuraFace (Apache 2.0)
        run: |
          mkdir -p ~/face-models bench/real-faces/.models
          f=~/face-models/auraface_glintr100.onnx
          [ -s "$f" ] || curl -sSfL -o "$f" https://huggingface.co/fal/AuraFace-v1/resolve/main/glintr100.onnx
          ln -sf "$f" bench/real-faces/.models/auraface_glintr100.onnx
      - name: Lay them out like a school's test folder
        run: node bench/real-faces/make-stand-in.mjs ~/face-bench-photos ~/school-test 25
      - name: Run the one-command face test
        run: |
          mkdir -p ~/real-face-cache ~/school-test/face-test-results/private
          [ -f ~/real-face-cache/faces-cache.json ] && cp ~/real-face-cache/faces-cache.json ~/school-test/face-test-results/private/ || true
          HUB_FACE_THREADS=4 bench/real-faces/face-test.sh ~/school-test
          cp ~/school-test/face-test-results/private/faces-cache.json ~/real-face-cache/
          cat ~/school-test/face-test-results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/real-face-cache
          key: real-face-cache-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-face-test-summary
          path: |
            ~/school-test/face-test-results/summary.md
            ~/school-test/face-test-results/summary.json
          retention-days: 30
